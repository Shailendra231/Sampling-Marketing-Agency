name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One deploy at a time per ref. A newer push supersedes an in-flight run so a
# slow build can never land on top of a newer one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # `npm ci` requires package-lock.json to be committed and in sync with
      # package.json. Switch to bun (bun install --frozen-lockfile) if bun.lock
      # becomes the canonical lockfile.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # On pull requests, build only — proves the Cloudflare bundle compiles
      # without touching the live Worker.
      - name: Build
        if: github.event_name == 'pull_request'
        run: npm run build

      # `npm run deploy` builds and then runs `wrangler deploy`. Nitro writes
      # .wrangler/deploy/config.json during the build, which wrangler follows to
      # the generated .output/server/wrangler.json.
      - name: Build and deploy
        if: github.event_name != 'pull_request'
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
