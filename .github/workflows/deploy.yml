name: CI

# Deployment is handled by Cloudflare Workers Builds, which is connected
# directly to this repository. This workflow only verifies that the code
# typechecks and that the Cloudflare bundle builds — it must not deploy, or it
# would race Workers Builds and deploy the same Worker twice per push.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # wrangler.jsonc declares build.command, so this builds the app and then
      # validates the generated config and Worker size limits — without
      # contacting Cloudflare or needing any credentials.
      - name: Build and validate Worker bundle
        run: npx wrangler deploy --dry-run
